# it runs the automated tests whenever a push and pull request is activated to main.
# No need to configure AWS access here since the tests use moto a fake AWS in memory.
name: Lambda health

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install the test tools
        run: pip install -r requirements-dev.txt

      - name: Run the tests
        run: pytest -v
